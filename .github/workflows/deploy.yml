name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --without dev
          npm ci

      - name: Run tests
        run: |
          cd apps/api
          poetry run pytest
          cd ../..
          npm run build:dashboard || true

      - name: Build and push Docker images
        run: |
          docker-compose -f infrastructure/docker/docker-compose.prod.yml build
          docker-compose -f infrastructure/docker/docker-compose.prod.yml up -d

      - name: Run database migrations
        run: |
          docker-compose -f infrastructure/docker/docker-compose.prod.yml exec -T api poetry run alembic upgrade head

      - name: Notify deployment
        run: echo "Deployment completed successfully"