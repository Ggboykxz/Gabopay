version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gabopay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gabopay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gabopay-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: gabopay-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/gabopay
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app/apps/api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: gabopay-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  docs:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.docs
    container_name: gabopay-docs
    ports:
      - "3001:3000"
    volumes:
      - ../../apps/docs:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  celery:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: gabopay-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/gabopay
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../apps/api:/app/apps/api
    command: celery -A apps.api.workers worker -l info

volumes:
  postgres_data:
  redis_data:
